[package]
name = "commutator-py"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Commutator operations for non-commutative algebras"
documentation = "https://docs.rs/commutator-rs"
homepage = "https://github.com/ChosunOne/signature-rs"
repository = "https://github.com/ChosunOne/signature-rs"
readme = "README.md"
keywords = ["commutator", "lie", "algebra", "combinatorics", "bracket"]
categories = ["data-structures", "mathematics", "science"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "commutator_py"
crate-type = ["cdylib"]

[dependencies]
ordered-float = "^5.0.0"
pyo3 = {version = "^0.25.1", features = ["ordered-float"]}
lyndon-rs = {path = "../lyndon-rs", version = "0.2.0"}
commutator-rs = {path = "../commutator-rs", version = "0.2.0"}

[package]
name = "signature-rs"
version = "0.1.0"
authors = ["ChosunOne"]
edition = "2024"
license = "AGPL-3.0-only"
description = "High-performance log signature computation for paths and time series data"
documentation = "https://docs.rs/signature-rs"
homepage = "https://github.com/ChosunOne/signature-rs"
repository = "https://github.com/ChosunOne/signature-rs"
readme = "README.md"
keywords = ["log", "signature", "lie", "paths", "series"]
categories = ["data-structures", "mathematics", "science", "algorithms"]

[dependencies]
ndarray = "^0.16.1"
num-traits = "^0.2.19"
ordered-float = "^5.0.0"
lie-rs = {path = "../lie-rs", version = "0.1.0"}
lyndon-rs = {path = "../lyndon-rs", version = "0.1.0"}
commutator-rs = {path = "../commutator-rs", version = "0.1.0"}
rayon = "^1.12.0"

[dev-dependencies]
rstest = "^0.26.1"
num-rational = "^0.4.2"
criterion = { version = "^0.8.2", features = ["html_reports"] }
rand = "^0.10.2"

[[bench]]
name = "logsig"
harness = false
